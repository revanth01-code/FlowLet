name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install backend dependencies
        working-directory: backend
        run: bun install

      - name: Type-check backend
        working-directory: backend
        run: bunx tsc --noEmit

      - name: Start MongoDB and PostgreSQL
        run: docker compose up -d

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..10}; do
            docker exec flowlet-postgres pg_isready -U flowlet && break
            sleep 2
          done

      - name: Run migrations
        working-directory: backend
        run: bun run migrate
        env:
          PGHOST: localhost
          PGPORT: 5434
          PGUSER: flowlet
          PGPASSWORD: flowlet
          PGDATABASE: flowlet

      - name: Run backend tests
        working-directory: backend
        run: bun test
        env:
          PGHOST: localhost
          PGPORT: 5434
          PGUSER: flowlet
          PGPASSWORD: flowlet
          PGDATABASE: flowlet
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB_NAME: flowlet
          PORT: 4000
          PUBLIC_BACKEND_URL: http://localhost:4000