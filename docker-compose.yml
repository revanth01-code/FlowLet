services:
  mongo:
    image: mongo:7
    container_name: flowlet-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: flowlet
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:16
    container_name: flowlet-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: flowlet
      POSTGRES_PASSWORD: flowlet
      POSTGRES_DB: flowlet
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongo_data:
  postgres_data:
